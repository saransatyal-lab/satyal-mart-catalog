<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Satyal Mart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green-950:#7A2E10;
    --green-900:#F86D30;
    --green-800:#E85A1D;
    --green-100:#FFE8DA;
    --paper:#FFFFFF;
    --surface:#FFFFFF;
    --line:#F0E2D9;
    --ink:#2B211C;
    --ink-soft:#8A776D;
    --marigold:#FFA469;
    --marigold-dark:#D8551D;
    --sale:#D0473C;
    --sale-bg:#FBE9E7;
    --shadow: 0 1px 2px rgba(19,32,24,0.06), 0 6px 20px rgba(19,32,24,0.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Nunito',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    padding-bottom:96px;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{
    font-family:'Barlow Condensed',sans-serif;
    letter-spacing:0.01em;
    margin:0;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input{font-family:inherit;}

  /* ---------- Header ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:var(--surface);
    color:var(--ink);
    padding:14px 16px 12px;
    border-bottom:1px solid var(--line);
    box-shadow:0 2px 10px rgba(43,33,28,0.04);
  }
  .topbar-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px;
  }
  .wordmark{
    display:flex; flex-direction:column; line-height:1;
  }
  .wordmark .name{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;
    font-size:25px;
    letter-spacing:0.01em;
    color:var(--green-900);
  }
  .wordmark .tag{
    font-size:10.5px;
    color:var(--ink-soft);
    font-weight:700;
    letter-spacing:0.09em;
    margin-top:1px;
  }
  .icon-btn{
    position:relative;
    width:34px; height:34px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background:var(--green-100);
    color:var(--green-900);
    flex-shrink:0;
  }
  .icon-btn svg{width:16px;height:16px;}
  .cart-badge{
    position:absolute; top:-4px; right:-4px;
    background:var(--green-900);
    color:#fff;
    font-size:10px; font-weight:800;
    min-width:16px; height:16px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    padding:0 4px;
    border:2px solid var(--surface);
  }
  .search-wrap{
    margin-top:12px;
    display:flex; align-items:center; gap:8px;
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:9px 12px;
  }
  .search-wrap:focus-within{border-color:var(--green-900);}
  .search-wrap svg{width:16px;height:16px;flex-shrink:0;color:var(--ink-soft);}
  .search-wrap input{
    background:none; border:none; outline:none;
    color:var(--ink); font-size:14.5px; width:100%;
  }
  .search-wrap input::placeholder{color:var(--ink-soft);}

  /* ---------- Banner ---------- */
  .banner{
    margin:16px 16px 0;
    background:linear-gradient(120deg, var(--marigold) 0%, #F2BE68 100%);
    border-radius:16px;
    padding:16px 18px;
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
    color:var(--green-950);
  }
  .banner .btxt .h{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700; font-size:21px; line-height:1.05;
  }
  .banner .btxt .s{
    font-size:12.5px; font-weight:600; color:rgba(19,32,24,0.72);
    margin-top:3px;
  }
  .banner .bicon{width:42px;height:42px;flex-shrink:0;opacity:0.9;}

  /* ---------- Categories ---------- */
  .cats{
    display:flex; gap:8px; overflow-x:auto;
    padding:16px 16px 4px;
    scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{display:none;}
  .cat-chip{
    flex-shrink:0;
    padding:8px 14px;
    border-radius:20px;
    font-size:13px; font-weight:700;
    background:var(--surface);
    color:var(--ink-soft);
    border:1.5px solid var(--line);
    white-space:nowrap;
  }
  .cat-chip.active{
    background:var(--green-900);
    color:#fff;
    border-color:var(--green-900);
  }

  /* ---------- Section label ---------- */
  .section-label{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 16px 10px;
    gap:10px;
  }
  .section-label h2{
    font-size:21px; font-weight:700; color:var(--green-950);
  }
  .section-label .count{
    font-size:12.5px; color:var(--ink-soft); font-weight:600;
  }
  .sort-select{
    flex-shrink:0;
    font-size:12px; font-weight:700; color:var(--ink);
    background:var(--surface); border:1.5px solid var(--line); border-radius:9px;
    padding:7px 10px; outline:none;
  }
  .sort-select:focus{border-color:var(--green-900);}
  .deals-chip.active{background:var(--green-900); color:#fff; border-color:var(--green-900);}

  /* ---------- Product grid ---------- */
  .grid{
    display:grid; grid-template-columns:1fr 1fr;
    gap:12px; padding:0 16px 8px;
  }
  .card{
    background:var(--surface);
    border-radius:16px;
    border:1px solid var(--line);
    overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow:var(--shadow);
  }
  .card-media{
    position:relative;
    aspect-ratio:1/0.82;
    background:var(--green-100);
    display:flex; align-items:center; justify-content:center;
  }
  .card-media svg{width:58%;height:58%;}
  .badge-off{
    position:absolute; top:8px; left:8px;
    background:var(--sale);
    color:#fff;
    font-size:11px; font-weight:800;
    padding:3px 7px; border-radius:7px;
    letter-spacing:0.02em;
  }
  .badge-stock{
    position:absolute; top:8px; right:8px;
    background:rgba(19,32,24,0.55);
    color:#fff;
    font-size:10px; font-weight:700;
    padding:3px 6px; border-radius:6px;
  }
  .card-body{padding:10px 11px 12px;}
  .card-brand{
    font-size:10.5px; font-weight:700; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:0.04em;
  }
  .card-name{
    font-size:14px; font-weight:700; color:var(--ink);
    margin-top:2px; line-height:1.25;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    min-height:35px;
  }
  .price-row{
    display:flex; align-items:baseline; gap:6px; margin-top:7px; flex-wrap:wrap;
  }
  .price-sale{
    font-family:'Barlow Condensed',sans-serif;
    font-size:19px; font-weight:700; color:var(--green-900);
  }
  .price-reg{
    font-size:12px; color:var(--ink-soft); text-decoration:line-through;
  }
  .card-foot{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:9px;
  }
  .add-btn{
    background:var(--green-900); color:#fff;
    font-size:12px; font-weight:700;
    padding:6px 11px; border-radius:8px;
    display:flex; align-items:center; gap:4px;
  }
  .add-btn svg{width:11px;height:11px;}
  .stepper{
    display:flex; align-items:center; background:var(--green-900);
    border-radius:8px; overflow:hidden;
  }
  .stepper button{
    color:#fff; width:24px; height:26px; font-size:15px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .stepper .qty{
    color:#fff; font-size:13px; font-weight:800; min-width:18px; text-align:center;
  }

  .empty{
    padding:40px 20px; text-align:center; color:var(--ink-soft);
  }
  .empty .e-ic{width:44px;height:44px;margin:0 auto 10px;color:var(--line);}

  /* ---------- Sticky cart bar ---------- */
  .cartbar{
    position:fixed; left:0; right:0; bottom:0;
    max-width:480px; margin:0 auto;
    background:var(--green-950);
    color:#fff;
    padding:13px 16px;
    display:flex; align-items:center; justify-content:space-between;
    border-radius:18px 18px 0 0;
    box-shadow:0 -6px 24px rgba(0,0,0,0.18);
    transform:translateY(110%);
    transition:transform 0.28s cubic-bezier(.2,.8,.2,1);
    z-index:45;
  }
  .cartbar.show{transform:translateY(0);}
  .cartbar-left{display:flex; align-items:center; gap:10px;}
  .cartbar-count{
    background:var(--marigold); color:var(--green-950);
    width:26px; height:26px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:13px;
  }
  .cartbar-total{font-family:'Barlow Condensed',sans-serif; font-size:18px; font-weight:700;}
  .cartbar-cta{
    background:var(--marigold); color:var(--green-950);
    font-weight:800; font-size:13.5px;
    padding:9px 16px; border-radius:10px;
    display:flex; align-items:center; gap:6px;
  }

  /* ---------- Sheets (bottom drawers) ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(19,24,20,0.45);
    opacity:0; pointer-events:none; transition:opacity 0.25s;
    z-index:50;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0;
    max-width:480px; margin:0 auto;
    background:var(--paper);
    border-radius:20px 20px 0 0;
    max-height:88vh;
    display:flex; flex-direction:column;
    transform:translateY(100%);
    transition:transform 0.32s cubic-bezier(.2,.8,.2,1);
    z-index:55;
  }
  .sheet.show{transform:translateY(0);}
  .sheet-handle{
    width:36px; height:4px; background:var(--line);
    border-radius:2px; margin:10px auto 2px;
  }
  .sheet-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px 12px; border-bottom:1px solid var(--line);
  }
  .sheet-head h3{font-size:20px; font-weight:700; color:var(--green-950);}
  .close-x{
    width:30px;height:30px; border-radius:9px; background:var(--green-100);
    display:flex; align-items:center; justify-content:center; color:var(--green-900);
  }
  .close-x svg{width:15px;height:15px;}
  .sheet-scroll{overflow-y:auto; padding:14px 18px 18px;}

  /* Product detail sheet */
  .pd-media{
    background:var(--green-100); border-radius:16px;
    aspect-ratio:1/0.75; display:flex; align-items:center; justify-content:center;
    position:relative; margin-bottom:14px;
  }
  .pd-media svg{width:44%;height:44%;}
  .pd-brand{font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em;}
  .pd-name{font-size:23px; font-weight:700; color:var(--green-950); margin-top:3px;}
  .pd-desc{font-size:13.5px; color:var(--ink-soft); margin-top:8px; line-height:1.5;}
  .pd-prices{
    display:flex; align-items:center; gap:10px; margin-top:14px;
    padding:12px 14px; background:var(--sale-bg); border-radius:12px;
  }
  .pd-prices .sale{font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:700; color:var(--sale);}
  .pd-prices .reg{font-size:14px; color:var(--ink-soft); text-decoration:line-through;}
  .pd-prices .save{font-size:12px; font-weight:700; color:var(--green-800); margin-left:auto;}
  .pd-qty-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:16px;
  }
  .pd-qty-row .lab{font-size:14px; font-weight:700; color:var(--ink);}
  .pd-stepper{
    display:flex; align-items:center; gap:14px;
    background:var(--surface); border:1.5px solid var(--line); border-radius:12px;
    padding:6px 14px;
  }
  .pd-stepper button{width:22px;height:22px; font-size:18px; font-weight:700; color:var(--green-900);}
  .pd-stepper .qv{font-size:15px; font-weight:800; min-width:20px; text-align:center;}
  .pd-add{
    margin-top:18px; width:100%; background:var(--green-900); color:#fff;
    padding:14px; border-radius:13px; font-size:15px; font-weight:800;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }

  /* Cart sheet */
  .cart-item{
    display:flex; gap:11px; padding:12px 0; border-bottom:1px solid var(--line);
  }
  .cart-item:last-child{border-bottom:none;}
  .ci-media{
    width:56px; height:56px; background:var(--green-100); border-radius:11px;
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .ci-media svg{width:60%;height:60%;}
  .ci-info{flex:1; min-width:0;}
  .ci-name{font-size:13.5px; font-weight:700; color:var(--ink); line-height:1.25;}
  .ci-unit{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .ci-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:7px;}
  .ci-sub{font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:700; color:var(--green-950);}
  .ci-stepper{
    display:flex; align-items:center; gap:10px;
    background:var(--green-100); border-radius:8px; padding:3px 9px;
  }
  .ci-stepper button{font-size:15px; font-weight:800; color:var(--green-900); width:16px;}
  .ci-stepper .q{font-size:12.5px; font-weight:800; min-width:14px; text-align:center;}

  .coupon-row{
    display:flex; gap:8px; margin-top:16px;
  }
  .coupon-row input{
    flex:1; border:1.5px solid var(--line); border-radius:11px;
    padding:11px 13px; font-size:13.5px; outline:none; background:var(--surface);
    text-transform:uppercase; letter-spacing:0.03em;
  }
  .coupon-row input:focus{border-color:var(--green-900);}
  .coupon-apply{
    background:var(--green-950); color:#fff; font-weight:700; font-size:13px;
    padding:0 16px; border-radius:11px;
  }
  .coupon-msg{
    margin-top:8px; font-size:12.5px; font-weight:700;
    display:flex; align-items:center; gap:6px;
  }
  .coupon-msg.ok{color:var(--green-800);}
  .coupon-msg.err{color:var(--sale);}
  .coupon-applied{
    margin-top:10px; display:flex; align-items:center; justify-content:space-between;
    background:var(--green-100); border-radius:10px; padding:9px 12px;
  }
  .coupon-applied .cname{font-size:12.5px; font-weight:800; color:var(--green-900);}
  .coupon-applied button{font-size:11.5px; font-weight:700; color:var(--sale);}

  .totals{margin-top:18px; padding-top:14px; border-top:1.5px dashed var(--line);}
  .trow{display:flex; justify-content:space-between; font-size:13.5px; color:var(--ink-soft); margin-bottom:7px;}
  .trow.grand{
    font-size:19px; font-weight:800; color:var(--green-950);
    padding-top:9px; border-top:1px solid var(--line); margin-top:9px;
  }
  .trow.save{color:var(--green-800); font-weight:700;}
  .checkout-cta{
    width:100%; background:var(--green-900); color:#fff; margin-top:16px;
    padding:15px; border-radius:13px; font-size:15px; font-weight:800;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }

  /* Checkout form sheet */
  .field{margin-bottom:14px;}
  .field label{font-size:12.5px; font-weight:700; color:var(--ink); display:block; margin-bottom:6px;}
  .field input, .field textarea{
    width:100%; border:1.5px solid var(--line); border-radius:12px;
    padding:12px 13px; font-size:14px; outline:none; background:var(--surface);
    resize:none;
  }
  .field input:focus, .field textarea:focus{border-color:var(--green-900);}
  .pay-note{
    display:flex; align-items:center; gap:10px;
    background:var(--green-100); border-radius:12px; padding:12px 13px; margin:6px 0 16px;
  }
  .pay-note svg{width:18px;height:18px; color:var(--green-900); flex-shrink:0;}
  .pay-note span{font-size:12.5px; font-weight:700; color:var(--green-900);}
  .remember-row{display:flex; align-items:flex-start; gap:8px; margin:-4px 0 16px;}
  .remember-row input{margin-top:2px; flex-shrink:0;}
  .remember-row label{font-size:12px; color:var(--ink-soft); font-weight:600; line-height:1.4;}
  .place-order{
    width:100%; background:var(--marigold); color:var(--green-950);
    padding:15px; border-radius:13px; font-size:15px; font-weight:800;
  }
  .place-order:disabled{opacity:0.45;}

  /* Confirmation */
  .confirm-wrap{padding:36px 22px 22px; text-align:center;}
  .confirm-tick{
    width:64px; height:64px; border-radius:50%; background:var(--green-900);
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px;
    animation:pop 0.45s cubic-bezier(.3,1.4,.5,1);
  }
  @keyframes pop{0%{transform:scale(0.3); opacity:0;} 100%{transform:scale(1); opacity:1;}}
  .confirm-tick svg{width:30px;height:30px; color:#fff;}
  .confirm-title{font-size:24px; font-weight:700; color:var(--green-950);}
  .confirm-order{
    font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700;
    color:var(--marigold-dark); margin-top:6px; letter-spacing:0.03em;
  }
  .confirm-sub{font-size:13.5px; color:var(--ink-soft); margin-top:10px; line-height:1.5;}
  .confirm-total{
    margin-top:18px; background:var(--surface); border:1.5px solid var(--line);
    border-radius:14px; padding:16px;
  }
  .confirm-total .amt{font-family:'Barlow Condensed',sans-serif; font-size:30px; font-weight:800; color:var(--green-950);}
  .confirm-total .lab{font-size:11.5px; color:var(--ink-soft); font-weight:700; letter-spacing:0.03em; margin-top:2px;}
  .confirm-steps{margin-top:20px; text-align:left;}
  .cstep{display:flex; align-items:center; gap:11px; padding:9px 0;}
  .cstep .n{
    width:24px;height:24px; border-radius:50%; background:var(--green-100); color:var(--green-900);
    font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .cstep.active .n{background:var(--marigold); color:var(--green-950);}
  .cstep .t{font-size:13px; font-weight:700; color:var(--ink);}
  .new-order-btn{
    width:100%; margin-top:22px; background:var(--green-950); color:#fff;
    padding:14px; border-radius:13px; font-size:14px; font-weight:800;
  }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- HEADER -->
  <div class="topbar">
    <div class="topbar-row">
      <div class="wordmark">
        <span class="name">Satyal Mart</span>
        <span class="tag">SCAN · SHOP · SAVE</span>
      </div>
      <button class="icon-btn" onclick="openCart()" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
      </button>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
      <input id="searchInput" type="text" placeholder="Search products, brands..." oninput="onSearch()">
    </div>
  </div>

  <!-- BANNER -->
  <div class="banner" onclick="toggleDeals()" style="cursor:pointer;">
    <div class="btxt">
      <div class="h">Today's Deals</div>
      <div class="s">Great prices, while stocks last</div>
    </div>
    <svg class="bicon" viewBox="0 0 24 24" fill="none" stroke="#7A2E10" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.42 4.58a5.4 5.4 0 0 0-7.65 0l-.77.78-.77-.78a5.4 5.4 0 0 0-7.65 7.65l8.42 8.42 8.42-8.42a5.4 5.4 0 0 0 0-7.65z" fill="#7A2E10" opacity="0.12"></path><path d="M9 12h6M12 9v6"></path></svg>
  </div>

  <!-- CATEGORIES -->
  <div class="cats" id="cats"></div>

  <!-- SECTION LABEL -->
  <div class="section-label">
    <div>
      <h2 id="sectionTitle">All Products</h2>
      <span class="count" id="resultCount"></span>
    </div>
    <select id="sortSelect" class="sort-select" onchange="setSort()">
      <option value="">Featured</option>
      <option value="name">Name (A–Z)</option>
      <option value="discount">Discount: High to Low</option>
    </select>
  </div>

  <!-- GRID -->
  <div class="grid" id="grid"></div>

  <!-- STICKY CART BAR -->
  <div class="cartbar" id="cartbar">
    <div class="cartbar-left">
      <div class="cartbar-count" id="cartbarCount">0</div>
      <div class="cartbar-total" id="cartbarTotal">Rs. 0</div>
    </div>
    <button class="cartbar-cta" onclick="openCart()">
      View Cart
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M9 18l6-6-6-6"></path></svg>
    </button>
  </div>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay" onclick="closeAllSheets()"></div>

  <!-- PRODUCT DETAIL SHEET -->
  <div class="sheet" id="pdSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h3>Product Details</h3>
      <button class="close-x" onclick="closeAllSheets()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="sheet-scroll" id="pdBody"></div>
  </div>

  <!-- CART SHEET -->
  <div class="sheet" id="cartSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h3>Your Cart</h3>
      <button class="close-x" onclick="closeAllSheets()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="sheet-scroll" id="cartBody"></div>
  </div>

  <!-- CHECKOUT SHEET -->
  <div class="sheet" id="checkoutSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h3>Checkout</h3>
      <button class="close-x" onclick="closeAllSheets()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="sheet-scroll">
      <div class="field">
        <label>Your Name</label>
        <input id="custName" type="text" placeholder="e.g. Saran Satyal" oninput="validateCheckout()">
      </div>
      <div class="field">
        <label>Mobile Number</label>
        <input id="custPhone" type="tel" placeholder="98XXXXXXXX" oninput="validateCheckout()">
      </div>
      <div class="field">
        <label>Order Note <span style="font-weight:600;color:var(--ink-soft);">(optional)</span></label>
        <textarea id="custNote" rows="2" placeholder="Any special instruction for staff"></textarea>
      </div>
      <div class="pay-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
        <span>Pay at counter — no online payment needed</span>
      </div>
      <div class="remember-row">
        <input type="checkbox" id="rememberMe" checked>
        <label for="rememberMe">Remember me on this phone for faster checkout next time</label>
      </div>
      <button class="place-order" id="placeOrderBtn" disabled onclick="placeOrder()">Place Order</button>
    </div>
  </div>

  <!-- CONFIRMATION SHEET -->
  <div class="sheet" id="confirmSheet">
    <div class="sheet-scroll" id="confirmBody"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
